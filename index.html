<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해외직판 사업계획서</title>
<style>
  :root {
    --ink: #1f2933;
    --muted: #6b7785;
    --line: #d9dee5;
    --line-soft: #eceff3;
    --bg: #f4f6f8;
    --paper: #ffffff;
    --input: #0b5ed7;
    --input-bg: #f5f9ff;
    --input-line: #b3cdf2;
    --neg: #d92d20;
    --hl: #fff7c2;
    --head: #f0f3f6;
    --accent: #1d6f42;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 14px;
    line-height: 1.45;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 24px; margin-bottom: 16px; }
  header.top h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink);
  }
  button:hover { background: var(--head); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #185c37; }
  .disclaimer { margin: 0 0 16px; text-align: right; color: var(--neg); font-weight: 700; font-size: 13px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
  .meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 20px; padding: 16px 20px; margin-bottom: 16px; }
  .meta label { display: block; font-weight: 700; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .meta .field { display: flex; align-items: center; gap: 6px; }
  .meta input[type=text] {
    width: 100%; font: inherit; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
  }
  .meta input.num { color: var(--input); font-weight: 700; text-align: right; max-width: 120px; }
  .guide { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  .guide b { color: var(--input); background: var(--hl); padding: 2px 8px; border-radius: 4px; }
  .guide .unit { margin-left: auto; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 4px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  thead th { background: var(--head); border-bottom: 1px solid var(--line); font-size: 12px; text-align: right; position: sticky; top: 0; }
  thead th:nth-child(-n+2) { text-align: left; }
  thead th:nth-child(3) { text-align: center; }
  td.sec { font-weight: 700; }
  td.sec .sub { font-weight: 400; display: block; }
  td.lbl { white-space: normal; min-width: 96px; max-width: 132px; }
  td.num { text-align: right; }
  td.inp { text-align: right; }
  td.inp .unit { display: inline-block; min-width: 44px; text-align: left; margin-left: 4px; color: var(--muted); font-size: 11px; }
  td.fixed { color: var(--muted); }
  td.neg { color: var(--neg); }
  tr.gap td { border-bottom: 0; height: 10px; padding: 0; }
  tr.sum td { border-top: 1px solid var(--line); font-weight: 700; background: #fafbfc; }
  tr.major td { font-weight: 700; }
  tr.hl td { background: var(--hl); font-weight: 700; border-top: 1px solid #e6d98a; border-bottom: 1px solid #e6d98a; }
  tr.note td { color: var(--muted); font-size: 12px; white-space: normal; border-bottom: 0; padding-top: 2px; padding-bottom: 2px; }
  input.cell {
    font: inherit; font-weight: 700; color: var(--input); text-align: right;
    width: 86px; padding: 2px 4px;
    border: 1px solid var(--input-line); border-radius: 5px; background: var(--input-bg);
    font-variant-numeric: tabular-nums;
  }
  input.cell.pct { width: 44px; }
  th:first-child, td:first-child { padding-left: 12px; }
  th:last-child, td:last-child { padding-right: 12px; }
  input.cell:focus, .meta input:focus { outline: 2px solid #9cc2f5; outline-offset: 0; border-color: var(--input); }
  @media (max-width: 720px) {
    .meta { grid-template-columns: 1fr; }
    header.top h1 { font-size: 20px; }
    .actions { margin-left: 0; width: 100%; }
    .actions button { flex: 1; }
  }
  @media print {
    body { background: #fff; }
    .actions { display: none; }
    .card { border: 0; }
    table { min-width: 0; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>해외직판 사업계획서</h1>
    <div class="actions">
      <button type="button" id="btnReset">초기값으로</button>
      <button type="button" id="btnDownload" class="primary">엑셀 다운로드</button>
    </div>
  </header>
  <p class="disclaimer">[용도: 사용자의 이해를 돕기 위한 것으로 티쿤은 계산방식 및 결과에 책임이 없습니다.]</p>

  <section class="card meta">
    <div>
      <label for="txtE5">회사명</label>
      <div class="field"><input type="text" id="txtE5" data-text="E5" autocomplete="off"></div>
    </div>
    <div>
      <label for="txtE6">판매품목</label>
      <div class="field"><input type="text" id="txtE6" data-text="E6" autocomplete="off"></div>
    </div>
    <div>
      <label for="inE9">기준환율</label>
      <div class="field"><input type="text" class="num" id="inE9" data-in="E9" data-dec="1" inputmode="decimal" autocomplete="off"><span>원/엔</span></div>
    </div>
  </section>

  <p class="guide"><b>[계획에 맞게 수정하세요]</b><span>파란색 숫자를 바꾸면 바로 다시 계산됩니다.</span><span class="unit">단위: 원</span></p>

  <section class="card scroll">
    <table>
      <thead>
        <tr><th>구분</th><th>항목</th><th>입력값</th><th>준비</th><th>1년차</th><th>2년차</th><th>3년차</th><th>4년차</th><th>5년차</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</div>

  const js = formula.replace(/^=/, '').replace(
    /SUM\(\$?([A-Z]+)\$?(\d+):\$?([A-Z]+)\$?(\d+)\)|(\d+(?:\.\d+)?)%|\$?([A-Z]+)\$?(\d+)/g,

  return new Function('V', 'S', 'return ' + js);

    if (c) {
      if (c.in) r = Number(inputs[a]) || 0;
      else if (c.f) { memo[a] = 0; r = (c.fn || (c.fn = compile(c.f)))(V, S); }
      else r = c.v;
    }
    return memo[a] = r;
  };
  const S = (c1, r1, c2, r2) => {
    let t = 0;
    for (let c = c1.charCodeAt(0); c <= c2.charCodeAt(0); c++)
      for (let r = r1; r <= r2; r++) t += V(String.fromCharCode(c) + r);
    return t;
  };
  Object.keys(CELLS).forEach(V);
  return memo;
}

function defaults() {
  const d = {};
  for (const a in CELLS) if (CELLS[a].in) d[a] = CELLS[a].v;
  return d;
}

const b64ToBytes = b => Uint8Array.from(atob(b), ch => ch.charCodeAt(0));
const escXml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function patchCell(xml, addr, build) {
  const re = new RegExp('<c r="' + addr + '"([^>]*?)(?:/>|>([\\s\\S]*?)</c>)');
  if (!re.test(xml)) throw new Error('셀을 찾을 수 없습니다: ' + addr);
  return xml.replace(re, (m, attrs, inner) =>
    build(attrs.replace(/\s+t="[^"]*"/, ''), inner || ''));
}
function setNumber(xml, addr, val) {
  return patchCell(xml, addr, (attrs, inner) => {
    const f = (inner.match(/<f[^>]*?\/>|<f[\s\S]*?<\/f>/) || [''])[0];
    return `<c r="${addr}"${attrs}>${f}<v>${val}</v></c>`;
  });
}
function setText(xml, addr, text) {
  return patchCell(xml, addr, attrs => text
    ? `<c r="${addr}"${attrs} t="inlineStr"><is><t xml:space="preserve">${escXml(text)}</t></is></c>`
    : `<c r="${addr}"${attrs}/>`);
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// 무압축(stored) zip
function zip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  for (const [name, data] of files) {
    const nm = enc.encode(name), crc = crc32(data);
    const head = (sig, extra) => {
      const b = new Uint8Array(extra + nm.length), v = new DataView(b.buffer);
      let p = 0;
      v.setUint32(p, sig, true); p += 4;
      if (extra === 46) { v.setUint16(p, 20, true); p += 2; }
      v.setUint16(p, 20, true); p += 2;       // version needed
      v.setUint16(p, 0x0800, true); p += 2;   // UTF-8 names
      v.setUint16(p, 0, true); p += 2;        // stored
      v.setUint16(p, 0, true); p += 2;        // time
      v.setUint16(p, 0x21, true); p += 2;     // date 1980-01-01
      v.setUint32(p, crc, true); p += 4;
      v.setUint32(p, data.length, true); p += 4;
      v.setUint32(p, data.length, true); p += 4;
      v.setUint16(p, nm.length, true); p += 2;
      if (extra === 46) v.setUint32(42, offset, true);
      b.set(nm, extra);
      return b;
    };
    const local = head(0x04034b50, 30);
    central.push(head(0x02014b50, 46));
    chunks.push(local, data);
    offset += local.length + data.length;
  }
  const cdSize = central.reduce((n, b) => n + b.length, 0);
  const end = new Uint8Array(22), v = new DataView(end.buffer);
  v.setUint32(0, 0x06054b50, true);
  v.setUint16(8, files.length, true);
  v.setUint16(10, files.length, true);
  v.setUint32(12, cdSize, true);
  v.setUint32(16, offset, true);
  const all = [...chunks, ...central, end];
  const out = new Uint8Array(all.reduce((n, b) => n + b.length, 0));
  let p = 0;
  for (const b of all) { out.set(b, p); p += b.length; }
  return out;
}

// 원본 서식·수식은 그대로 두고 입력값과 계산 결과만 채운 xlsx (Uint8Array)
function buildXlsx(inputs, texts) {
  const vals = calculate(inputs);
  let xml = new TextDecoder().decode(b64ToBytes(PARTS[SHEET]));
  for (const a in CELLS) if (CELLS[a].in || CELLS[a].f) xml = setNumber(xml, a, vals[a]);
  for (const a in texts) xml = setText(xml, a, texts[a].trim());
  return zip(Object.keys(PARTS).map(name =>
    [name, name === SHEET ? new TextEncoder().encode(xml) : b64ToBytes(PARTS[name])]));
}
</script>

<script>
// r: 엑셀 행 번호. F열 = 입력값, G~L열 = 준비~5년차.
const ROWS = [
  { r: 11, sec: '• 투자금', cls: 'major' },
  { gap: 1 },
  { r: 13, sec: '초기 비용', label: '티쿤 계약금/보증금' },
  { r: 14, label: '회사 설립비용' },
  { r: 15, label: '온라인사이트 구축' },
  { r: 16, label: '사무실 비품' },
  { r: 17, label: '기타' },
  { r: 18, label: '계', cls: 'sum' },
  { gap: 1 },
  { r: 21, sec: '1. 매출', cls: 'major' },
  { r: 22, label: '(월 매출, 소비세/일내배송비 제외)', unit: '(엔/월)' },
  { gap: 1 },
  { r: 24, sec: '2. 비용', label: '사무실 임대료', unit: '월 기준', sub: '(1) 고정비' },
  { r: 25, label: '사무실 유지비', unit: '월 기준' },
  { r: 26, label: '인건비(1)*', unit: '월급' },
  { r: 27, label: '인건비(2)*', unit: '월급' },
  { r: 28, label: '인건비(3)*', unit: '월급' },
  { r: 29, label: '인건비(4)*', unit: '월급' },
  { r: 30, label: '접대비/복리후생비', unit: '월 기준' },
  { r: 31, label: '광고비', unit: '매출 대비', pct: 1 },
  { r: 32, label: '기타 잡비', unit: '월 기준' },
  { r: 33, label: '소계', cls: 'sum', unit: '' },
  { note: '* 인건비 = 급여+상여금(200%)+퇴직적립금(100%)+국민연금(4.75%)+건강보험(3.595%)+장기요양보험(건강보험의 13.14%)+고용보험 (1.15%)' },
  { note: '** 고정비 연간 인상율 : 3%' },
  { gap: 1 },
  { r: 38, sub: '(2) 변동비', label: '상품 구입비', unit: '매출 대비', pct: 1 },
  { r: 39, label: '물류비', unit: '매출 대비', pct: 1 },
  { r: 40, label: '관세', unit: '매출 대비', pct: 1 },
  { r: 41, label: 'PG 수수료', unit: '매출 대비', pct: 1 },
  { r: 42, label: '기타 (국내 배송비 등)', unit: '매출 대비', pct: 1 },
  { r: 43, label: '티쿤 수수료', unit: '', pct: 1 },
  { r: 44, label: '소계', cls: 'sum', unit: '', pct: 1 },
  { gap: 1 },
  { r: 47, sub: '(3) 계, (1) +(2)', cls: 'major' },
  { gap: 1 },
  { r: 49, sec: '3. 손익, 1-2', cls: 'hl' },
  { r: 50, label: '(이익 누계)' },
  { gap: 1 },
  { r: 52, sec: '4. 보유 현금', cls: 'hl' },
];
const COLS = ['F', 'G', 'H', 'I', 'J', 'K', 'L'];

const inputs = defaults();
const esc = s => escXml(s).replace(/"/g, '&quot;');

function fmtInput(v, el) {
  if (el.dataset.pct) return String(parseFloat((v * 100).toFixed(6)));
  if (el.dataset.dec) return String(v);
  return Math.round(v).toLocaleString('en-US');
}
function fmtOut(v, pct) {
  if (pct) return parseFloat((v * 100).toFixed(4)) + '%';
  const n = Math.round(v);
  return n === 0 ? '-' : n.toLocaleString('en-US');
}

function renderRows() {
  const html = ROWS.map(row => {
    if (row.gap) return '<tr class="gap"><td colspan="9"></td></tr>';
    if (row.note) return `<tr class="note"><td></td><td colspan="8">${esc(row.note)}</td></tr>`;
    const sub = row.sub ? `<span class="sub">${esc(row.sub)}</span>` : '';
    let tds = `<td class="sec">${esc(row.sec || '')} ${sub}</td><td class="lbl">${esc(row.label || '')}</td>`;
    for (const col of COLS) {
      const a = col + row.r, c = CELLS[a];
      const pct = col === 'F' && row.pct;
      const unit = col === 'F' && row.unit != null ? `<span class="unit">${esc(row.unit)}</span>` : '';
      if (c && c.in) {
        tds += `<td class="inp"><input type="text" class="cell${pct ? ' pct' : ''}" data-in="${a}"${pct ? ' data-pct="1"' : ''} inputmode="${pct ? 'decimal' : 'numeric'}" autocomplete="off" aria-label="${esc((row.label || row.sec || '') + ' ' + a)}">${pct ? '<span>%</span>' : ''}${unit}</td>`;
      } else if (c) {
        tds += `<td class="num${c.f ? '' : ' fixed'}" data-out="${a}"${pct ? ' data-pct="1"' : ''}></td>`;
      } else {
        tds += `<td class="${col === 'F' ? 'inp' : 'num'}">${col === 'F' && row.unit ? esc(row.unit) : ''}</td>`;
      }
    }
    return `<tr class="${row.cls || ''}">${tds}</tr>`;
  }).join('');
  document.getElementById('rows').innerHTML = html;
}

function recalc() {
  const vals = calculate(inputs);
  document.querySelectorAll('[data-out]').forEach(td => {
    const v = vals[td.dataset.out];
    td.textContent = fmtOut(v, td.dataset.pct);
    td.classList.toggle('neg', Math.round(v) < 0);
  });
}

function fillInputs() {
  document.querySelectorAll('[data-in]').forEach(el => { el.value = fmtInput(inputs[el.dataset.in], el); });
}

// 입력 중에는 값을 건드리지 않는다 (한글 IME·커서 위치 문제 방지). 천 단위 구분은 포커스가 빠질 때 넣는다.
function parseInput(el) {
  const raw = el.value
    .replace(/[０-９．]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[^\d.]/g, '');
  const num = parseFloat(raw) || 0;
  return el.dataset.pct ? num / 100 : num;
}
function onInput(e) {
  const el = e.target;
  if (!el.dataset || !el.dataset.in) return;
  inputs[el.dataset.in] = parseInput(el);
  recalc();
}

function download() {
  const texts = {};
  document.querySelectorAll('[data-text]').forEach(el => { texts[el.dataset.text] = el.value; });
  const bytes = buildXlsx(inputs, texts);
  const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const company = texts.E5.trim().replace(/[\\/:*?"<>|]/g, '_');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '해외직판_사업계획서' + (company ? '_' + company : '') + '.xlsx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

renderRows();
fillInputs();
recalc();
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);
document.addEventListener('compositionend', onInput);
document.addEventListener('focusin', e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.in) return;
  el.value = fmtInput(inputs[el.dataset.in], el).replace(/,/g, '');
  el.select();
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.in) return;
  inputs[el.dataset.in] = parseInput(el);
  el.value = fmtInput(inputs[el.dataset.in], el);
  recalc();
});
document.getElementById('btnDownload').addEventListener('click', download);
document.getElementById('btnReset').addEventListener('click', () => {
  Object.assign(inputs, defaults());
  fillInputs();
  recalc();
});
</script>
</body>
